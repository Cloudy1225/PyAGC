default:
  # S2CAG model parameters
  T: 10                    # Number of propagation steps
  alpha: 0.9              # Decay factor for smoothing
  tau: 7                  # Number of iterations for SVD approximation
  oversampling: 10        # Oversampling parameter for randomized SVD

  # Clustering configuration
  cluster_method: snem    # Options: snem, kmeans
  snem_iterations: 100    # Number of iterations for SNEM rounding

  # K-Means clustering parameters (only used if cluster_method is 'kmeans')
  kmeans_backend: torch   # Options: torch, triton, sklearn
  kmeans_n_init: 10
  kmeans_max_iter: 300
  normalize_embeddings: true  # Whether to normalize embeddings before clustering

  # Evaluation metrics
  label_metrics: ['NMI', 'ARI', 'ACC', 'F1', 'Homo', 'Comp']
  struct_metrics: ['Mod', 'Cond']

  # Inference configuration
  allow_cpu_fallback: true  # Allow fallback to CPU if GPU OOM

