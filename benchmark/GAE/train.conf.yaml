  epochs: 1
  lr: 0.001
  hidden_channels: 64
  num_layers: 2
  batch_size: 16384
  infer_batch_size: 32768
  infer_fan_out: 10  # Limit neighbors for very large graphs
  force_full_batch_inference: false  # Definitely too large
  allow_cpu_fallback: false  # Not needed for mini-batch
  norm: batch_norm
  kmeans_n_init: 10
  kmeans_max_iter: 300
  save_every: 1  # Save at end of each epoch
  save_every_batch: 500  # Save every 500 batches for Papers100M (critical for recovery)
