default:
  # Pretraining hyperparameters
  pretrain_lr: 0.01
  pretrain_epochs: 200

  # Finetuning hyperparameters
  finetune_lr: 0.001
  finetune_epochs: 200

  # Common hyperparameters
  wd: 0.0
  patience: 50

  # Checkpoint settings
  pretrain_save_every: null  # Save checkpoint every N epochs (null = disabled)
  pretrain_save_every_batch: null  # Save checkpoint every N batches (null = disabled)
  finetune_save_every: null
  finetune_save_every_batch: null

  # Training mode configuration
  mini_batch: false  # Whether to use mini-batch training

  # Evaluation settings
  eval_pretrain: true  # Whether to evaluate clustering after pretraining

  # Evaluation metrics
  label_metrics: ['NMI', 'ARI', 'ACC', 'F1', 'Homo', 'Comp']
  struct_metrics: ['Mod', 'Cond']

  # GNN architecture
  gnn_type: gat  # DAEGC uses GAT encoder

  # Model architecture
  hidden_channels: 256
  num_layers: 2
  dropout: 0.0
  act: elu
  act_first: false
  act_last: false
  norm: null  # Options: null/none, batch_norm, layer_norm

  # GAT-specific parameters
  heads: 1
  concat: true

  # DAEGC-specific parameters
  gamma: 10.0  # Weight for clustering loss
  update_interval: 5  # Update target distribution every N iterations

  # Mini-batch training parameters
  fan_out: 10
  batch_size: 16384
  num_workers: 8

  # Inference configuration
  force_full_batch_inference: false  # Try full-batch inference even if mini_batch=true
  allow_cpu_fallback: true  # Allow fallback to CPU full-batch if GPU OOM
  infer_batch_size: 256  # Batch size for inference; can be larger than batch_size
  infer_fan_out: -1  # -1 means sample all neighbors

  # K-Means clustering parameters (for pretrain evaluation)
  kmeans_backend: torch  # Options: torch, triton, sklearn
  kmeans_n_init: 10
  kmeans_max_iter: 300
  normalize_embeddings: true  # Whether to normalize embeddings before clustering

