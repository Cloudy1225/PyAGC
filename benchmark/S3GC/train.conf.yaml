default:
  # Training hyperparameters
  lr: 0.01
  wd: 0.0
  epochs: 200
  patience: 20

  # Checkpoint settings
  enable_checkpointing: true  # Enable/disable checkpoint saving (set false to skip all checkpoint operations)
  save_every: null  # Save checkpoint every N epochs (null = disabled, only save best/last)
  save_every_batch: null  # Save checkpoint every N batches (null = disabled, for large datasets)

  # Evaluation metrics
  label_metrics: ['NMI', 'ARI', 'ACC', 'F1', 'Homo', 'Comp']
  struct_metrics: ['Mod', 'Cond']

  # Model architecture
  hidden_channels: 256
  walk_length: 3
  walks_per_node: 10
  batch_size: 512

  # Diffusion parameters
  k_hop: 2
  diffusion_method: ppr  # Options: ppr, heat, custom
  alpha: 0.2  # For PPR diffusion
  heat_t: 5.0  # For heat diffusion

  # Scale selection
  scale: auto  # Options: auto, small, medium, large

  # K-Means clustering parameters
  kmeans_backend: torch  # Options: torch, triton, sklearn
  kmeans_n_init: 10
  kmeans_max_iter: 300
  normalize_embeddings: true

