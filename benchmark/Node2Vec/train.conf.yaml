default:
  # Training hyperparameters
  lr: 0.01
  wd: 0.0
  epochs: 200
  patience: 20

  # Checkpoint settings
  enable_checkpointing: true  # Enable/disable checkpoint saving (set false to skip all checkpoint operations)
  save_every: null  # Save checkpoint every N epochs (null = disabled, only save best/last)
  save_every_batch: null  # Save checkpoint every N batches (null = disabled, for large datasets)

  # Evaluation metrics
  label_metrics: ['NMI', 'ARI', 'ACC', 'F1', 'Homo', 'Comp']
  struct_metrics: ['Mod', 'Cond']

  # Model architecture
  embedding_dim: 128
  walk_length: 10
  context_size: 10
  walks_per_node: 10
  num_negative_samples: 1
  p: 1.0  # Return parameter
  q: 1.0  # In-out parameter
  sparse: false  # Use sparse gradients
  batch_size: 128
  cpu_embedding: false  # Store embeddings on CPU (for very large graphs)

  # K-Means clustering parameters
  kmeans_backend: torch  # Options: torch, triton, sklearn
  kmeans_n_init: 10
  kmeans_max_iter: 300
  normalize_embeddings: true

